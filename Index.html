<div id="gadaa-ai-chat" style="position: fixed; bottom: 20px; right: 20px; width: 340px; max-width: 90vw; background: #1a2a1f; border: 1px solid #caa33b; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 9999; font-family: system-ui, sans-serif; display: none;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #caa33b; background: #0a2f1f; border-radius: 16px 16px 0 0;">
    <div style="color: #caa33b; font-weight: bold; font-size: 14px;">Gadaa AI Assistant</div>
    <button id="gadaa-close-chat" style="background: none; border: none; color: #caa33b; cursor: pointer; font-size: 18px;">×</button>
  </div>
  <div id="gadaa-chat-messages" style="height: 220px; overflow-y: auto; padding: 10px; color: #fff; font-size: 13px; line-height: 1.4;"></div>
  <div style="padding: 8px; border-top: 1px solid #caa33b;">
    <input id="gadaa-chat-input" type="text" placeholder="Ask about Gadaa, trees, or restoration..." style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #caa33b; background: #0a2f1f; color: #fff; font-size: 13px; box-sizing: border-box;" />
    <button id="gadaa-send-chat" style="width: 100%; margin-top: 6px; padding: 8px; background: linear-gradient(135deg, #caa33b, #a07e2c); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000;">Send</button>
  </div>
</div>

<!-- Floating open button -->
<button id="gadaa-open-chat" style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #caa33b, #a07e2c); border: none; cursor: pointer; font-size: 24px; box-shadow: 0 4px 15px rgba(202,163,59,0.5); z-index: 9998;">🌳</button>

<script>
(function() {
  var chatBox = document.getElementById('gadaa-ai-chat');
  var openBtn = document.getElementById('gadaa-open-chat');
  var closeBtn = document.getElementById('gadaa-close-chat');
  var sendBtn = document.getElementById('gadaa-send-chat');
  var input = document.getElementById('gadaa-chat-input');
  var messages = document.getElementById('gadaa-chat-messages');

  openBtn.addEventListener('click', function() {
    chatBox.style.display = 'block';
    openBtn.style.display = 'none';
  });

  closeBtn.addEventListener('click', function() {
    chatBox.style.display = 'none';
    openBtn.style.display = 'block';
  });

  function addMessage(text, isUser) {
    var div = document.createElement('div');
    div.style.marginBottom = '8px';
    div.style.padding = '6px 8px';
    div.style.borderRadius = '8px';
    div.style.background = isUser ? '#2e4a3a' : '#0a2f1f';
    div.style.color = isUser ? '#fff' : '#caa33b';
    div.innerHTML = '<strong>' + (isUser ? 'You' : 'AI') + ':</strong> ' + text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  async function sendMessage() {
    var text = input.value.trim();
    if (!text) return;
    addMessage(text, true);
    input.value = '';
    addMessage('Thinking...', false);

    try {
      var res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      var data = await res.json();
      messages.removeChild(messages.lastChild);
      addMessage(data.reply || 'No response.', false);
    } catch (err) {
      messages.removeChild(messages.lastChild);
      addMessage('Sorry, something went wrong. Please try again.', false);
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMessage(); });
})();
</script>
<!-- ==================== END GADAA AI CHAT WIDGET ==================== -->
